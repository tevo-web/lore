<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New tab</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data:">
<script src="early.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="home.css">
</head>
<body>
<div class="col">
  <section id="start" hidden>
    <p class="when" id="when"></p>
    <h1 id="hi"></h1>
    <form class="ask-box" id="askbox" autocomplete="off">
      <input id="askin" type="text" spellcheck="false" aria-label="Ask or search">
      <button type="submit" class="go" id="askgo" aria-label="Go"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
    <div id="cont" hidden><p class="k" id="cont-k"></p><div class="conts" id="conts"></div></div>
    <div id="sites" hidden><p class="k" id="sites-k"></p><div class="tiles" id="tiles"></div></div>
    <div id="tips" hidden><p class="k" id="tips-k"></p><div class="tipl" id="tipl"></div></div>
    <p class="privnote" id="privnote" hidden></p>
  </section>

  <h1 id="h1" data-i18n="home.h1"></h1>
  <p class="sub" id="sub" data-i18n="home.sub"></p>

  <div class="note" id="note" role="status"><span id="msg"></span><small id="soon"></small></div>
  <div id="resume" hidden><p class="k" id="resume-k"></p><div id="resume-l"></div></div>
  <div id="rec" hidden><p class="k" id="rec-k"></p><p class="lead" id="rec-t"></p><p class="meta" id="rec-m"></p></div>
  <div id="hits"></div>
  <form class="ask-box follow" id="follow" autocomplete="off" hidden>
    <input id="followin" type="text" spellcheck="false" aria-label="Ask more">
    <button type="submit" class="go" aria-label="Go"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </form>

  <div id="ans" hidden>
    <p class="ask" id="ask"></p>
    <p class="lead" id="lead"></p>
    <div id="srcs"></div>
    <p class="meta" id="meta"></p>
    <a class="btn" id="web" data-i18n="ans.web"></a>
  </div>

  <section id="cards" aria-label="Suggestions">
    <div class="cards">
      <a class="card" id="c-ask"><span class="tag" data-i18n="card.ask.tag"></span><b data-i18n="card.ask.q"></b></a>
      <a class="card" id="c-do"><span class="tag" data-i18n="card.do.tag"></span><b data-i18n="card.do.q"></b></a>
      <a class="card" id="c-dl"><span class="tag" data-i18n="card.dl.tag"></span><b data-i18n="card.dl.q"></b></a>
      <a class="card" id="c-mem"><span class="tag" data-i18n="card.mem.tag"></span><b data-i18n="card.mem.q"></b></a>
    </div>
  </section>
  <section id="tools" aria-label="Tools">
    <div class="chips">
      <a class="chip" id="t-tasks" data-i18n="tool.tasks"></a>
      <a class="chip" id="t-private" data-i18n="tool.private"></a>
      <a class="chip" id="t-memory" data-i18n="tool.memory"></a>
      <a class="chip" id="t-settings" data-i18n="tool.settings"></a>
    </div>
  </section>
  <p class="foot" id="stats"></p>
</div>
<script src="i18n.js"></script>
<script src="home.js"></script>
</body>
</html>
